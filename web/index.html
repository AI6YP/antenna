<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lindenblad and QFH antennas for HAM LEO satellites — AI6YP</title>
  <script>
    // apply saved theme / language before first paint
    try {
      var th = localStorage.getItem('theme');
      if (th === 'light' || th === 'dark') { document.documentElement.setAttribute('data-theme', th); }
      var q = new URLSearchParams(location.search).get('lang');
      var l = q || localStorage.getItem('lang') || ((navigator.language || '').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en');
      document.documentElement.lang = l === 'ru' ? 'ru' : 'en';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="panel">
    <div id="toolbar"></div>
    <h2 data-i18n="h.params">Parameters</h2>
    <div id="antenna-select"></div>
    <form id="inputs"></form>
    <div id="sim-controls"></div>
    <p class="note" id="sim-status"></p>
  </aside>
  <header>
    <h1 data-i18n="h1">Lindenblad and QFH antennas for HAM LEO satellites</h1>
    <p><span data-i18n="intro"></span> <a href="https://github.com/AI6YP/antenna" data-i18n="source">source</a></p>
  </header>

  <main>
    <section id="status">
      <h2 data-i18n="h.status">Status</h2>
      <div id="status-list"></div>
    </section>

    <section id="calc">
      <h2 data-i18n="h.calc">Calculator</h2>
      <div class="cols">
        <div id="dims"></div>
        <div id="view3d"></div>
      </div>
    </section>

    <section id="sim">
      <h2 data-i18n="h.sim">NEC2 simulation</h2>
      <p class="note" id="sim-note"></p>
      <div class="grid">
        <figure><figcaption data-i18n="p.swr"></figcaption><div id="plot-swr"></div></figure>
        <figure><figcaption data-i18n="p.z"></figcaption><div id="plot-z"></div></figure>
        <figure><figcaption data-i18n="p.gain"></figcaption><div id="plot-gain"></div></figure>
        <figure><figcaption data-i18n="p.ar"></figcaption><div id="plot-ar"></div></figure>
      </div>
      <figure class="pattern">
        <figcaption data-i18n="p.p3"></figcaption>
        <div id="pattern-controls"></div>
        <div id="pattern3d"></div>
      </figure>
    </section>

    <section id="sats">
      <h2 data-i18n="h.sats">Satellites</h2>
      <div id="sat-table"></div>
    </section>
  </main>

  <footer>AI6YP · <a href="https://github.com/AI6YP/antenna">github.com/AI6YP/antenna</a></footer>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
